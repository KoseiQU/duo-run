<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="format-detection" content="telephone=no">

<title>DUO RUN — BGM 聴き比べ</title>
<!--
  DUO RUN — BGM 聴き比べサンプル（P9a-2 / 契約 §3・§8 2026-09-28）
  ・6作風 × 8〜16小節ループ。低速（ステージ序盤）／高速（終盤・テンポ +15%）。
  ・外部依存なし・音源ファイルなし。すべて WebAudio で合成する
    （減算合成・FM・加算合成のピアノ・カープラス・ストロングの琴。ピアノと琴は JS で波形を計算して AudioBuffer に書く）。
  ・「機械音っぽさ」対策: 単一オシレータは鳴らさない（2本以上のデチューン／FM／物理モデル）、
    全パートに ADSR とフィルタ、生成インパルス応答のリバーブ＋付点8分ディレイ（センド）、
    ノートごとにベロシティ ±15%・タイミング ±8ms、4〜16小節のコード進行とフレーズ末の休符。
  ・マスター: ハイシェルフ → グルー・コンプ → 作風ごとの音量補正（RMS を OfflineAudioContext で測って決めた値）→ リミッタ。
  ・機械検証は「自己診断」ボタン（window.MUSIC.diag()）。
-->
<style>
  :root{
    --lumen:#ffb347; --umbra:#7d8cff; --ink:#e8ecff; --bg:#05070f;
    --panel:rgba(18,23,50,.78); --line:rgba(150,175,255,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    background:radial-gradient(120% 60% at 50% -10%, #17204a 0%, #0a0e22 45%, var(--bg) 75%) fixed, var(--bg);
    padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 250px);
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:780px; margin:0 auto;}
  header{text-align:center; margin-bottom:18px;}
  .logo{margin:0; font-weight:300; letter-spacing:.24em; font-size:clamp(30px,9vw,46px); line-height:1.05;}
  .logo .l{color:#fff3dc; text-shadow:0 0 2px #fff,0 0 6px #ffcf8a,0 0 14px #ffb347,0 0 30px #ff9a1a;}
  .logo .u{color:#eef0ff; text-shadow:0 0 2px #fff,0 0 6px #b9c3ff,0 0 14px #8c9bff,0 0 30px #5b6cff;}
  h1{font-size:15px; font-weight:700; letter-spacing:.3em; margin:10px 0 6px; opacity:.9;}
  .lead{font-size:13px; line-height:1.75; opacity:.72; margin:0 auto; max-width:34em; word-break:keep-all; overflow-wrap:anywhere;}
  .note{font-size:12px; opacity:.6; margin:8px 0 0; word-break:keep-all; overflow-wrap:anywhere;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:18px;}
  .card{
    --acc:#8c9bff; --glow:rgba(140,155,255,.35);
    position:relative; display:block; width:100%; min-height:112px; text-align:left; cursor:pointer;
    font:inherit; color:var(--ink); padding:14px 14px 12px; border-radius:16px;
    background:linear-gradient(180deg,rgba(26,32,66,.78),rgba(12,16,38,.86));
    border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:transform .12s, border-color .15s, box-shadow .15s;
  }
  .card:active{transform:scale(.98);}
  .card .no{font-size:11px; letter-spacing:.14em; color:var(--acc); opacity:.9;}
  .card .nm{font-size:17px; font-weight:700; margin:3px 0 5px; line-height:1.3; word-break:keep-all; overflow-wrap:anywhere;}
  .card .mt span{white-space:nowrap;}
  .card .ds{font-size:12px; line-height:1.55; opacity:.72;}
  .card .mt{font-size:10.5px; letter-spacing:.04em; opacity:.5; margin-top:7px;}
  .card .eq{position:absolute; top:12px; right:12px; display:none; gap:2px; align-items:flex-end; height:14px;}
  .card .eq i{display:block; width:3px; background:var(--acc); border-radius:2px; animation:eq 0.9s ease-in-out infinite;}
  .card .eq i:nth-child(2){animation-delay:.2s;} .card .eq i:nth-child(3){animation-delay:.45s;}
  @keyframes eq{0%,100%{height:4px;} 50%{height:14px;}}
  .card.on{border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset, 0 0 26px var(--glow), 0 8px 24px rgba(0,0,0,.35);}
  .card.on.playing .eq{display:flex;}
  .card.busy .nm::after{content:" …準備中"; font-size:11px; font-weight:400; opacity:.6;}

  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(180deg,rgba(8,11,26,.86),rgba(5,7,15,.96));
    border-top:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .bar .in{max-width:780px; margin:0 auto; display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center;}
  .status{flex:1 1 100%; display:flex; align-items:center; gap:10px; font-size:12.5px; min-height:18px;}
  .status .t{flex:1; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prog{flex:1 1 100%; height:3px; background:rgba(255,255,255,.08); border-radius:2px; overflow:hidden;}
  .prog i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--lumen),var(--umbra));}
  .meter{width:64px; height:6px; background:rgba(255,255,255,.08); border-radius:3px; overflow:hidden;}
  .meter i{display:block; height:100%; width:0; background:linear-gradient(90deg,#7dffc8,#ffd479,#ff6a6a);}
  button.ctl{
    font:inherit; font-size:15px; font-weight:700; letter-spacing:.06em; color:var(--ink);
    min-height:48px; min-width:48px; padding:0 20px; border-radius:99px; cursor:pointer;
    border:1px solid rgba(255,179,71,.6); background:rgba(255,179,71,.10); color:#ffd9a6;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden;}
  .seg button{font:inherit; font-size:13px; font-weight:700; color:var(--ink); opacity:.55; min-height:48px; padding:0 14px;
    border:0; background:transparent; cursor:pointer;}
  .seg button.on{opacity:1; background:rgba(125,140,255,.22); color:#dfe4ff;}
  .vol{display:flex; align-items:center; gap:8px; flex:1 1 140px; font-size:12px; opacity:.85;}
  input[type=range]{flex:1; min-width:90px; height:48px; accent-color:#8c9bff; background:transparent;}

  details{margin-top:26px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;}
  summary{cursor:pointer; font-size:13px; font-weight:700; letter-spacing:.06em; min-height:32px; line-height:32px;}
  .diag p{font-size:12px; opacity:.7; line-height:1.7;}
  .diag button{font:inherit; font-size:13px; font-weight:700; color:#d2d8ff; min-height:44px; padding:0 18px; border-radius:99px;
    border:1px solid rgba(125,140,255,.6); background:rgba(125,140,255,.12); cursor:pointer;}
  .tbl{overflow-x:auto; margin-top:10px;}
  table{border-collapse:collapse; font-size:11.5px; width:100%; min-width:560px;}
  th,td{padding:5px 6px; border-bottom:1px solid rgba(255,255,255,.08); text-align:right; white-space:nowrap;}
  th:first-child,td:first-child{text-align:left;}
  td.ng{color:#ff9bb0;} td.ok{color:#a8f4d8;}
  #diag-sum{font-size:12.5px; margin-top:8px; line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="logo"><span class="l">DUO</span> <span class="u">RUN</span></p>
    <h1>BGM 聴き比べ</h1>
    <p class="lead">6つの作風を用意しました。カードをタップすると再生、もう一度タップで停止します。気に入った作風（組み合わせでも）を教えてください。</p>
    <p class="note">iPhone は消音モード（サイドスイッチ）が ON だと鳴らないことがあります。</p>
  </header>

  <div class="grid" id="grid"></div>

  <details class="diag" id="diag">
    <summary>自己診断（機械検証）</summary>
    <p>各作風を OfflineAudioContext で 10 秒ずつ描画し、無音でないか・クリップしないか・作風間の音量差・ループ長・帯域のバランス（低域 &lt;250Hz／中域／高域 &gt;4kHz）を数値で確かめます。</p>
    <button type="button" id="diag-run">診断を実行</button>
    <div id="diag-sum"></div>
    <div class="tbl" id="diag-out"></div>
  </details>
</div>

<div class="bar">
  <div class="in">
    <div class="status"><span class="t" id="st">作風を選んでください</span><span class="meter"><i id="mt"></i></span></div>
    <div class="prog"><i id="pg"></i></div>
    <button type="button" class="ctl" id="play" aria-label="再生・停止">▶ 再生</button>
    <div class="seg" role="group" aria-label="テンポ">
      <button type="button" id="slow" class="on">低速（序盤）</button>
      <button type="button" id="fast">高速（終盤）</button>
    </div>
    <label class="vol">音量<input type="range" id="vol" min="0" max="100" value="80"></label>
  </div>
</div>

<script>
'use strict';
/* ==========================================================================
   1. 道具
   ========================================================================== */
const TAU = Math.PI * 2;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const dbToG = (d) => Math.pow(10, d / 20);
const gToDb = (g) => 20 * Math.log10(Math.max(1e-9, g));
const NOTE_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nm(s) {
  const r = /^([A-G])(#|b)?(-?\d)$/.exec(s);
  if (!r) throw new Error('bad note: ' + s);
  return 12 * (+r[3] + 1) + NOTE_BASE[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0);
}
/* "F2 | F3 A3 C4 E4" → { b: ベース, n: [ボイシング] } */
function chord(s) {
  const p = s.split('|');
  return { b: nm(p[0].trim()), n: p[1].trim().split(/\s+/).map(nm) };
}
/* 1小節 = 16分音符 16個。音名で打鍵、"." は伸ばす、"-" は休符、"|" は読みやすさのための区切り */
function mel(s) {
  const tk = s.trim().split(/\s+/).filter((x) => x !== '|');
  if (tk.length !== 16) throw new Error('1小節は16個: ' + s);
  const out = []; let cur = null;
  tk.forEach((x, i) => {
    if (x === '.') { if (cur) cur.len++; }
    else if (x === '-') cur = null;
    else { cur = { m: nm(x), s: i, len: 1 }; out.push(cur); }
  });
  return out;
}
function bq(c, type, f, q) {
  const b = c.createBiquadFilter(); b.type = type; b.frequency.value = f;
  if (q != null) b.Q.value = q;
  return b;
}
/* ADSR（0 から立ち上げ、dur で離す）。止めてよい時刻を返す */
function env(p, t, peak, a, d, s, dur, r) {
  p.setValueAtTime(0, t);
  p.linearRampToValueAtTime(peak, t + a);
  p.setTargetAtTime(peak * s, t + a, Math.max(0.004, d / 3));
  const te = t + Math.max(dur, a + 0.005);
  p.setTargetAtTime(0, te, Math.max(0.004, r / 3));
  return te + r * 1.8 + 0.05;
}

/* ==========================================================================
   2. エンジン（AudioContext ごとに1つ。本番の再生とオフラインの診断で同じものを使う）
   ========================================================================== */
function Engine(ctx, dest) {
  const E = this, c = ctx;
  E.c = c; E.sr = c.sampleRate; E.cache = {};
  E.input = c.createGain();
  E.hs = bq(c, 'highshelf', 8000); E.hs.gain.value = 1.5;              // 軽いハイシェルフ
  E.glue = c.createDynamicsCompressor();                                // まとめ役のコンプ
  E.glue.threshold.value = -18; E.glue.knee.value = 12; E.glue.ratio.value = 2.5;
  E.glue.attack.value = 0.02; E.glue.release.value = 0.25;
  E.lim = c.createDynamicsCompressor();                                 // 天井（クリップ防止）
  E.lim.threshold.value = -3; E.lim.knee.value = 0; E.lim.ratio.value = 20;
  E.lim.attack.value = 0.001; E.lim.release.value = 0.09;
  E.vol = c.createGain();
  E.an = c.createAnalyser(); E.an.fftSize = 2048;
  E.input.connect(E.hs); E.hs.connect(E.glue); E.glue.connect(E.lim);
  E.lim.connect(E.vol); E.vol.connect(E.an); E.an.connect(dest);
  /* 白色ノイズ 2秒（打楽器・息・テープの雑音の素） */
  const nb = c.createBuffer(1, E.sr * 2, E.sr), nd = nb.getChannelData(0), r = mulberry32(7);
  for (let i = 0; i < nd.length; i++) nd[i] = r() * 2 - 1;
  E.noise = nb;
  /* 位相をずらしたノコギリ波・矩形波（同時に鳴らしたデチューン波の頭が揃って「ビッ」と鳴るのを避ける） */
  E.waves = { saw: [], sq: [] };
  for (let k = 0; k < 5; k++) {
    const ph = 0.37 + k * 1.31;
    E.waves.saw.push(E.wave('saw', ph));
    E.waves.sq.push(E.wave('sq', ph));
  }
}
Engine.prototype.wave = function (kind, ph) {
  const N = 80, re = new Float32Array(N + 1), im = new Float32Array(N + 1);
  for (let k = 1; k <= N; k++) {
    let b = kind === 'saw' ? ((k % 2 ? 1 : -1) / k) : (k % 2 ? 1 / k : 0);
    b *= 1 / (1 + Math.pow(k / 40, 2));                                  // 上の倍音を少し丸める（耳に刺さらない）
    re[k] = b * Math.sin(k * ph); im[k] = b * Math.cos(k * ph);
  }
  return this.c.createPeriodicWave(re, im);
};
/* 生成インパルス応答（ステレオ・減衰するノイズ・時間とともに高域が落ちる・初期反射） */
Engine.prototype.ir = function (o) {
  const key = 'ir' + o.dur + '_' + o.pow + '_' + o.damp + '_' + o.pre;
  if (this.cache[key]) return this.cache[key];
  const sr = this.sr, len = Math.floor(sr * (o.dur + o.pre)), b = this.c.createBuffer(2, len, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch), r = mulberry32(101 + ch * 17);
    let lp = 0;
    const p0 = Math.floor(o.pre * sr);
    for (let i = p0; i < len; i++) {
      const u = (i - p0) / (len - p0);
      const e = Math.pow(1 - u, o.pow) * Math.exp(-u * 2.2);
      const a = 0.92 - o.damp * u * 0.85;
      lp += a * ((r() * 2 - 1) - lp);
      d[i] = lp * e;
    }
    for (let k = 0; k < 9; k++) {
      const idx = p0 + Math.floor((0.006 + k * 0.0113 + r() * 0.005) * sr);
      if (idx < len) d[idx] += (r() < 0.5 ? -1 : 1) * 0.55 * (1 - k / 10);
    }
  }
  this.cache[key] = b;
  return b;
};
/* ピアノ（加算合成: 弦の非調和性・2本弦のうなり・倍音ごとの二段減衰・ハンマーの打撃音）を波形に書く */
Engine.prototype.piano = function (m) {
  const key = 'p' + m;
  if (this.cache[key]) return this.cache[key];
  const sr = this.sr, f0 = mtof(m), rr = mulberry32(m * 97 + 13);
  const T = Math.min(6, 1.4 + 3.4 * Math.pow(2, -(m - 60) / 18));
  const len = Math.floor(sr * T), L = new Float32Array(len), R = new Float32Array(len);
  const B = 0.00015 * Math.pow(2, (m - 60) / 15);
  const tau1 = Math.min(4.5, 2.2 * Math.pow(2, -(m - 60) / 20));
  const pan = Math.max(-0.45, Math.min(0.45, (m - 64) / 40));
  for (let k = 1; k <= 24; k++) {
    const fk = k * f0 * Math.sqrt(1 + B * k * k);
    if (fk > sr * 0.42) break;
    const a = Math.pow(k, -1.05) * (0.25 + Math.abs(Math.sin(Math.PI * k * 0.12)));
    const tauk = tau1 / (1 + 0.45 * (k - 1));
    const ns = k <= 8 ? 2 : 1;
    for (let s = 0; s < ns; s++) {
      const f = ns === 2 ? fk * (1 + (s ? 1 : -1) * 0.00032) : fk;
      const w = TAU * f / sr, c2 = 2 * Math.cos(w), ph = rr() * TAU;
      let y1 = Math.sin(ph - w), y2 = Math.sin(ph - 2 * w);
      let e1 = 0.7, e2 = 0.3;
      const r1 = Math.exp(-1 / (tauk * 0.3 * sr)), r2 = Math.exp(-1 / (tauk * 1.6 * sr));
      const p = pan + (ns === 2 ? (s ? 0.12 : -0.12) : 0);
      const amp = a / ns, gl = Math.cos((p + 1) * Math.PI / 4) * amp, gr = Math.sin((p + 1) * Math.PI / 4) * amp;
      const nEnd = Math.min(len, Math.floor(tauk * 1.6 * sr * 7));
      for (let n = 0; n < nEnd; n++) {
        const y = c2 * y1 - y2; y2 = y1; y1 = y;
        const v = y * (e1 + e2); e1 *= r1; e2 *= r2;
        L[n] += v * gl; R[n] += v * gr;
      }
    }
  }
  const atk = Math.floor(0.0025 * sr);
  for (let n = 0; n < atk; n++) { const q = n / atk; L[n] *= q; R[n] *= q; }
  let lp = 0;
  const hl = Math.floor(0.03 * sr);
  for (let n = 0; n < hl; n++) {
    lp += 0.25 * ((rr() * 2 - 1) - lp);
    const v = lp * 0.12 * Math.exp(-n / (0.005 * sr));
    L[n] += v; R[n] += v;
  }
  const fo = Math.floor(0.05 * sr);
  for (let n = 0; n < fo; n++) { const q = n / fo; L[len - 1 - n] *= q; R[len - 1 - n] *= q; }
  let pk = 1e-6;
  for (let n = 0; n < len; n++) pk = Math.max(pk, Math.abs(L[n]), Math.abs(R[n]));
  const sc = 0.6 / pk;
  const b = this.c.createBuffer(2, len, sr);
  const dl = b.getChannelData(0), dr = b.getChannelData(1);
  for (let n = 0; n < len; n++) { dl[n] = L[n] * sc; dr[n] = R[n] * sc; }
  this.cache[key] = b;
  return b;
};
/* 琴（カープラス・ストロング: 撥弦位置で色づけしたノイズを、平均化フィルタ付きの遅延線で回す） */
Engine.prototype.ks = function (m) {
  const key = 'k' + m;
  if (this.cache[key]) return this.cache[key];
  const sr = this.sr, f = mtof(m), P = sr / f, N = Math.max(4, Math.floor(P - 0.5));
  const T60 = Math.max(1.2, Math.min(4.5, 3.6 * Math.pow(2, -(m - 57) / 24)));
  const T = Math.min(5, T60 * 0.9 + 0.3), len = Math.floor(sr * T);
  const rho = Math.pow(0.001, 1 / (T60 * f));
  const rr = mulberry32(m * 31 + 5);
  const ex = new Float32Array(N);
  let lp = 0, mean = 0;
  for (let i = 0; i < N; i++) { lp += 0.55 * ((rr() * 2 - 1) - lp); ex[i] = lp; }
  const pp = Math.max(1, Math.round(N * 0.16));
  const ex2 = new Float32Array(N);
  for (let i = 0; i < N; i++) { ex2[i] = ex[i] - (i >= pp ? ex[i - pp] : 0); mean += ex2[i]; }
  mean /= N;
  const y = new Float32Array(len);
  for (let n = 0; n < len; n++) {
    const x = n < N ? ex2[n] - mean : 0;
    const a = n >= N ? y[n - N] : 0, b2 = n >= N + 1 ? y[n - N - 1] : 0;
    y[n] = x + rho * 0.5 * (a + b2);
  }
  let pk = 1e-6;
  for (let n = 0; n < len; n++) pk = Math.max(pk, Math.abs(y[n]));
  const fo = Math.floor(0.05 * sr);
  for (let n = 0; n < fo; n++) y[len - 1 - n] *= n / fo;
  const b = this.c.createBuffer(1, len, sr), d = b.getChannelData(0);
  for (let n = 0; n < len; n++) d[n] = y[n] * (0.5 / pk);
  const out = { buf: b, rate: (N + 0.5) / P };
  this.cache[key] = out;
  return out;
};

/* ==========================================================================
   3. 楽器（S = 再生中のセッション、out = パートの入口）
   ========================================================================== */
function osc(S, kind, f) {
  const o = S.c.createOscillator();
  if (kind === 'saw' || kind === 'sq') { const w = S.E.waves[kind]; o.setPeriodicWave(w[(S.rnd() * w.length) | 0]); }
  else o.type = kind === 'tri' ? 'triangle' : kind;
  o.frequency.value = f;
  return o;

function nsrc(S) {

    if (opt.onRow) opt.onRow(a);
  }
  const mean = rows.reduce((s, r) => s + r.rms, 0) / rows.length;
  rows.forEach((r) => { r.dev = r.rms - mean; r.devOk = Math.abs(r.dev) <= 2; });
  const ok = rows.every((r) => r.sound && r.clip && r.devOk && r.loopOk);
  return { ok: ok, meanRms: mean, spread: Math.max.apply(null, rows.map((r) => r.rms)) - Math.min.apply(null, rows.map((r) => r.rms)), rows: rows };
}
/* パートごとの音量（開発用: どのパートが出すぎ／引っ込みすぎかを数値で見る） */
async function partLevels(id, sec) {
  const st = STY[id], out = {};
  for (const k of Object.keys(st.parts)) {
    const a = analyse(await renderStyle(id, sec || 6, { solo: k }));
    out[k] = +a.rms.toFixed(1);
  }
  return out;
}
MUSIC.diag = diag; MUSIC.renderStyle = renderStyle; MUSIC.analyse = analyse; MUSIC.lufs = lufs; MUSIC.partLevels = partLevels;
MUSIC.NORM = NORM; MUSIC.TARGET_RMS = TARGET_RMS;
window.MUSIC = MUSIC;

/* ==========================================================================
   9. 画面
   ========================================================================== */
const UI = {
  cards: {},
  init() {
    const grid = document.getElementById('grid');
    STYLES.forEach((st) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'card';
      b.style.setProperty('--acc', st.acc); b.style.setProperty('--glow', st.glow);
      b.innerHTML = '<span class="eq"><i></i><i></i><i></i></span><div class="no">' + st.no + '</div><div class="nm">' + st.name.replace(/・/g, '・<wbr>') +
        '</div><div class="ds">' + st.desc + '</div><div class="mt"><span>' + st.bpm + ' BPM</span> ・ <span>' + st.key + '</span> ・ <span>' + st.bars + '小節 ' + st.loopSec.toFixed(1) + '秒</span></div>';
      b.addEventListener('click', () => {
        if (MUSIC.cur === st.id && (MUSIC.playing() || MUSIC.busy)) MUSIC.stop();
        else MUSIC.play(st.id);
      });
      grid.appendChild(b);
      UI.cards[st.id] = b;
    });
    document.getElementById('play').addEventListener('click', () => { if (MUSIC.playing() || MUSIC.busy) MUSIC.stop(); else MUSIC.play(MUSIC.cur); });
    document.getElementById('slow').addEventListener('click', () => MUSIC.setFast(false));
    document.getElementById('fast').addEventListener('click', () => MUSIC.setFast(true));
    const vol = document.getElementById('vol');
    vol.addEventListener('input', () => MUSIC.setVol(vol.value / 100));
    document.getElementById('diag-run').addEventListener('click', UI.runDiag);
    UI.render();
    UI.loop();
  },
  render() {
    STYLES.forEach((st) => {
      const b = UI.cards[st.id];
      b.classList.toggle('on', MUSIC.cur === st.id);
      b.classList.toggle('playing', MUSIC.cur === st.id && MUSIC.playing());
      b.classList.toggle('busy', MUSIC.cur === st.id && MUSIC.busy);
    });
    document.getElementById('play').textContent = (MUSIC.playing() || MUSIC.busy) ? '■ 停止' : '▶ 再生';
    document.getElementById('slow').classList.toggle('on', !MUSIC.fast);
    document.getElementById('fast').classList.toggle('on', MUSIC.fast);
  },
  loop() {
    const st = STY[MUSIC.cur], pos = MUSIC.position();
    const lv = MUSIC.playing() ? MUSIC.level() : 0;
    document.getElementById('mt').style.width = Math.min(100, Math.max(0, (gToDb(lv) + 48) / 48 * 100)) + '%';
    document.getElementById('pg').style.width = pos ? (pos.frac * 100).toFixed(1) + '%' : '0';
    const tempo = MUSIC.fast ? '高速 ' + Math.round(st.bpm * 1.15) : '低速 ' + st.bpm;
    document.getElementById('st').textContent = MUSIC.busy ? st.name + ' — 準備中…'
      : MUSIC.playing() ? st.name + ' — ' + tempo + ' BPM — 小節 ' + ((pos ? pos.bar : 0) + 1) + '/' + st.bars
      : st.name + '（停止中）';
    requestAnimationFrame(UI.loop);
  },
  async runDiag() {
    const btn = document.getElementById('diag-run'), out = document.getElementById('diag-out'), sum = document.getElementById('diag-sum');
    btn.disabled = true; btn.textContent = '診断中…'; out.innerHTML = ''; sum.textContent = '';
    const f = (x, d) => x.toFixed(d);
    const cell = (v, ok) => '<td class="' + (ok ? 'ok' : 'ng') + '">' + v + '</td>';
    let html = '<table><tr><th>作風</th><th>RMS dBFS</th><th>差</th><th>LUFS≈</th><th>ピーク</th><th>低/中/高 %</th><th>重心 Hz</th><th>ループ 秒（高速）</th></tr>';
    try {
      const r = await diag({ onRow: (a) => { sum.textContent = a.name + ' を描画しました（' + a.ms + 'ms）'; } });
      r.rows.forEach((a) => {
        html += '<tr><td>' + a.name + '</td>' + cell(f(a.rms, 1), a.sound) + cell((a.dev >= 0 ? '+' : '') + f(a.dev, 1), a.devOk) +
          '<td>' + f(a.lufs, 1) + '</td>' + cell(f(a.peak, 3), a.clip) +
          '<td>' + a.bands.map((b) => f(b, 1)).join(' / ') + '</td><td>' + Math.round(a.centroid) + '</td>' +
          cell(a.bars + '小節 ' + f(a.loopSec, 1) + '（' + f(a.loopFast, 1) + '）', a.loopOk) + '</tr>';
      });
      html += '</table>';
      out.innerHTML = html;
      sum.innerHTML = (r.ok ? '<b style="color:#a8f4d8">合格</b>' : '<b style="color:#ff9bb0">不合格あり</b>') +
        ' — 無音なし・ピーク &lt; 0.98・作風間の RMS 差 ±2dB（幅 ' + f(r.spread, 1) + 'dB）・ループ＝8〜16小節の整数・30〜40秒';
    } catch (e) {
      sum.textContent = '診断に失敗: ' + (e && e.message ? e.message : e);
    }
    btn.disabled = false; btn.textContent = '診断を実行';
  }
};
UI.init();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<!-- favicon を要求させない（ファイルを置かない＝$0構成のまま、コンソールを汚さない） -->
<link rel="icon" href="data:,">
<title>DUO RUN — Light &amp; Shadow</title>
<style>
  :root{
    --lumen:#ffb347; --lumen-dim:#8a5a12;
    --umbra:#7d8cff; --umbra-dim:#2f3a8a;
    --ink:#e8ecff; --bg:#05070f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;}
  #app{position:fixed; inset:0; touch-action:none;}
  #gl{display:block; width:100%; height:100%;}

  /* ---------- HUD ---------- */
  #hud{position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;}
  #hud.on{opacity:1;}
  .hud-top{position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:0; right:0;
    display:flex; gap:10px; align-items:baseline; justify-content:center; flex-wrap:wrap;
    font-variant-numeric:tabular-nums; letter-spacing:.04em;}
  #hud-dist{font-size:26px; font-weight:700; text-shadow:0 0 14px rgba(140,170,255,.55);}
  #hud-speed{font-size:13px; opacity:.75;}
  #hud-stage{font-size:13px; opacity:.55;}
  .flag{font-size:11px; padding:2px 7px; border:1px solid currentColor; border-radius:99px; opacity:.9;}
  #flag-mirror{color:#cfd6ff;} #flag-swap{color:#ffd0a0;}

  .hands{position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    display:flex; justify-content:space-between; padding:0 14px;}
  .hand{min-width:120px; padding:7px 11px; border-radius:12px; font-size:12px; line-height:1.5;
    background:rgba(10,14,28,.55); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(3px);}
  .hand b{display:block; font-size:13px; letter-spacing:.12em;}
  .hand[data-char="lumen"]{color:var(--lumen); border-color:rgba(255,179,71,.45); box-shadow:0 0 18px rgba(255,179,71,.14) inset;}
  .hand[data-char="umbra"]{color:var(--umbra); border-color:rgba(125,140,255,.45); box-shadow:0 0 18px rgba(125,140,255,.14) inset;}
  .hand span{opacity:.65;}
  .hand.r{text-align:right;}

  /* ---------- タッチ領域: 画面を上下に2分割（§4.2/§4.8 改訂） ----------
     上半分＝天井のUMBRA（藍）／下半分＝床のLUMEN（琥珀）。常時ごく薄く示す。 */
  #touchzones{position:absolute; inset:0; display:flex; flex-direction:column; pointer-events:none;}
  #touchzones .tz{flex:1; position:relative;}
  #touchzones .tz.top{background:linear-gradient(to bottom,rgba(125,140,255,.13),rgba(125,140,255,0) 46%);
    box-shadow:inset 0 2px 0 rgba(125,140,255,.30), inset 2px 0 0 rgba(125,140,255,.14), inset -2px 0 0 rgba(125,140,255,.14);}
  #touchzones .tz.bottom{background:linear-gradient(to top,rgba(255,179,71,.13),rgba(255,179,71,0) 46%);
    box-shadow:inset 0 -2px 0 rgba(255,179,71,.30), inset 2px 0 0 rgba(255,179,71,.14), inset -2px 0 0 rgba(255,179,71,.14);}
  /* チュートリアルの吹き出しは分割線の上に出るので、その間はラベルを伏せる */
  /* 中央の分割線 */
  #touch-split{position:absolute; left:3%; right:3%; top:50%; height:3px; transform:translateY(-1.5px);
    background:linear-gradient(90deg,rgba(255,179,71,0),rgba(255,190,90,1) 14%,#ffffff 50%,rgba(140,155,255,1) 86%,rgba(125,140,255,0));
    box-shadow:0 0 6px rgba(255,255,255,.75), 0 0 16px rgba(190,200,255,.6), 0 0 32px rgba(160,170,255,.35); border-radius:3px;}
  /* 横持ち: 親指が届く位置（両端・中央寄り）に薄いガイド */
  .thumb{position:absolute; width:54px; height:54px; border-radius:50%; opacity:.16; display:none;
    border:1px dashed currentColor;}
  @media (orientation:landscape){ .thumb{display:block;} }
  .thumb.tl{left:14px; top:calc(50% - 74px); color:var(--umbra);}
  .thumb.tr{right:14px; top:calc(50% - 74px); color:var(--umbra);}
  .thumb.bl{left:14px; top:calc(50% + 20px); color:var(--lumen);}
  .thumb.br{right:14px; top:calc(50% + 20px); color:var(--lumen);}

  /* ---------- 画面 ---------- */
  .screen{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:24px; background:radial-gradient(120% 90% at 50% 50%,rgba(5,7,15,.35),rgba(5,7,15,.92));}
  .screen.on{display:flex;}
  h1{font-size:clamp(28px,7vw,52px); font-weight:800; letter-spacing:.16em; line-height:1.15;}
  h1 .l{color:var(--lumen); text-shadow:0 0 26px rgba(255,179,71,.5);}
  h1 .u{color:var(--umbra); text-shadow:0 0 26px rgba(125,140,255,.5);}
  .sub{font-size:13px; opacity:.7; line-height:1.8; max-width:30em;}
  .btns{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  button{font:inherit; font-size:15px; font-weight:700; letter-spacing:.06em; color:var(--ink);
    padding:12px 26px; border-radius:99px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06); cursor:pointer; transition:transform .12s, background .12s;}
  button:hover{background:rgba(255,255,255,.14); transform:translateY(-1px);}
  button.primary{border-color:rgba(255,179,71,.6); color:#ffd9a6;}
  button.second{border-color:rgba(125,140,255,.6); color:#d2d8ff;}
  .big{font-size:22px; font-weight:700;}

  /* ---------- ネオン都市UI ---------- */
  .neon{position:relative; display:inline-block; padding:2px 0;
    color:#eaf0ff; text-shadow:0 0 6px rgba(120,200,255,.9),0 0 22px rgba(90,140,255,.55);}
  .panel{background:linear-gradient(180deg,rgba(24,30,62,.72),rgba(12,16,38,.78));
    border:1px solid rgba(150,175,255,.28); border-radius:16px; padding:18px 20px;
    box-shadow:0 0 34px rgba(60,90,200,.20) inset, 0 8px 30px rgba(0,0,0,.35);
    backdrop-filter:blur(6px);}
  .label{font-size:11px; letter-spacing:.34em; opacity:.6;}
  button[data-ui]{position:relative;}
  button.ghost{border-color:rgba(255,255,255,.18); color:rgba(232,236,255,.75); font-size:13px; padding:9px 18px;}

  /* ステージ選択 */
  #stage-grid{display:grid; grid-template-columns:repeat(4,minmax(96px,1fr)); gap:10px; max-width:560px; width:100%;}
  @media (max-width:560px){ #stage-grid{grid-template-columns:repeat(2,1fr);} }
  .stage-card{position:relative; text-align:left; padding:11px 12px; border-radius:13px; cursor:pointer;
    border:1px solid rgba(150,175,255,.26); background:rgba(18,24,52,.66); color:var(--ink);
    font:inherit; transition:transform .12s, background .12s, border-color .12s;}
  .stage-card:hover:not([disabled]){transform:translateY(-2px); background:rgba(30,40,86,.8); border-color:rgba(255,179,71,.5);}
  .stage-card[disabled]{opacity:.38; cursor:default;}
  .stage-card .no{font-size:15px; font-weight:800; letter-spacing:.08em; color:var(--lumen);}
  .stage-card .nm{font-size:11px; opacity:.72; line-height:1.4; margin-top:2px;}
  .stage-card .meta{font-size:10px; opacity:.6; margin-top:5px; letter-spacing:.06em;}
  .stage-card .star{position:absolute; top:8px; right:9px; font-size:13px; color:#ffd479; text-shadow:0 0 10px rgba(255,190,90,.8);}
  .stage-card .lock{position:absolute; top:8px; right:9px; font-size:12px; opacity:.6;}

  /* リザルト */
  .result-big{font-size:clamp(26px,6vw,44px); font-weight:800; letter-spacing:.18em;}
  .result-clear{color:#ffd9a6; text-shadow:0 0 26px rgba(255,179,71,.6);}
  .result-dead{color:#ff9bb0; text-shadow:0 0 26px rgba(255,80,120,.5);}
  #clear-best,#dead-best{font-size:12px; letter-spacing:.1em; color:#ffe2a8; min-height:1.2em;}

  /* ---------- チュートリアルの吹き出し（§4.8 / P2b-0 で位置と改行を修正） ----------
     ・位置: 画面のちょうど中央（分割線の上）。2体は床(下)と天井(上)を走るので、
       この中央の帯だけは **どちらの投影矩形とも交差しない**（機械テストあり）。
     ・改行: 句（.ph）を inline-block にして、語の途中では絶対に折り返させない。 */
  #tip{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96);
    max-width:min(78vw,430px); padding:7px 15px; border-radius:12px; text-align:center;
    font-size:clamp(12px,2.1vw,16px); font-weight:700; letter-spacing:.04em; line-height:1.42;
    color:#eef3ff; background:linear-gradient(180deg,rgba(26,34,70,.88),rgba(12,16,38,.88));
    border:1px solid rgba(150,190,255,.45); box-shadow:0 0 26px rgba(80,140,255,.28);
    word-break:keep-all; overflow-wrap:normal;
    opacity:0; pointer-events:none; transition:opacity .22s, transform .22s;}
  #tip.on{opacity:1; transform:translate(-50%,-50%) scale(1);}
  #tip .ph{display:inline-block; white-space:nowrap;}
  #tip .k{color:var(--lumen);}
  #tip .k2{color:var(--umbra);}
  #tip .finger{font-size:17px; margin-right:4px; vertical-align:-2px;}
  @media (orientation:landscape){ #tip{max-width:min(64vw,520px); font-size:13px; padding:5px 13px;} }

  /* ---------- ゾーン切替の暗転（§6 P3a 切替を繋ぐ簡易演出） ---------- */
  #zonefade{position:absolute; inset:0; background:#05070f; opacity:0; pointer-events:none;}
  #zonefade.on{animation:zoneFade .42s ease-out 1;}
  @keyframes zoneFade{0%{opacity:1;} 60%{opacity:.55;} 100%{opacity:0;}}

  /* ---------- 大演出の予告（§4.4 ビル間の大ジャンプ「JUMP!」） ---------- */
  #cue{position:absolute; left:50%; top:44%; transform:translate(-50%,-50%) scale(.8);
    text-align:center; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;}
  #cue.on{opacity:1; transform:translate(-50%,-50%) scale(1); animation:cuePulse .55s ease-in-out infinite alternate;}
  #cue-main{text-shadow:0 0 18px rgba(255,190,90,.85),0 0 48px rgba(255,140,40,.55),0 2px 10px rgba(0,0,0,.6);}
  #cue-main{font-size:clamp(26px,min(9vw,12vh),58px); font-weight:800; letter-spacing:.2em; color:#ffe6b0;
    text-shadow:0 0 18px rgba(255,190,90,.85),0 0 48px rgba(255,140,40,.55);}
  #cue-sub{font-size:clamp(11px,2vw,14px); letter-spacing:.14em; color:#dfe6ff; opacity:.85; margin-top:2px;}
  @keyframes cuePulse{from{filter:brightness(.82);} to{filter:brightness(1.25);}}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="zonefade"></div>

  <div id="touchzones" data-ui="touchzones">
    <div class="tz top" data-zone="top"></div>
    <div class="tz bottom" data-zone="bottom"></div>
    <div id="touch-split"></div>
    <div class="thumb tl"></div><div class="thumb tr"></div>
    <div class="thumb bl"></div><div class="thumb br"></div>
  </div>

  <div id="hud">
    <div class="hud-top">
      <span id="hud-stage">—</span>
      <span id="hud-dist">0 m</span>
      <span id="hud-speed">8.0 m/s</span>
      <span class="flag" id="flag-mirror" style="display:none">MIRROR</span>
      <span class="flag" id="flag-swap" style="display:none">SWAP</span>
    </div>
    <div id="tip" data-ui="tip"></div>
    <div id="cue" data-ui="cue"><div id="cue-main">JUMP!</div><div id="cue-sub"></div></div>
    <div class="hands">
      <div class="hand" id="hand-left" data-char="lumen">
        <b id="hand-left-name">LUMEN</b><span id="hand-left-keys">下半分</span>
      </div>
      <div class="hand r" id="hand-right" data-char="umbra">
        <b id="hand-right-name">UMBRA</b><span id="hand-right-keys">上半分</span>
      </div>
    </div>
  </div>

  <div class="screen on" id="screen-title" data-ui="screen-title">
    <h1><span class="l">DUO</span> <span class="u">RUN</span></h1>
    <div class="label">LIGHT &amp; SHADOW</div>
    <div class="sub">
      画面の<b style="color:var(--lumen)">下半分</b>で LUMEN（床）、<b style="color:var(--umbra)">上半分</b>で UMBRA（天井）。<br>
      フリックで操作。<b>足場から離れる向きがジャンプ</b>。<br>
      下半分は<b style="color:var(--lumen)">上へ</b>、上半分は<b style="color:var(--umbra)">下へ</b>フリックでジャンプ。横フリックでレーン移動。
    </div>
    <div class="btns">
      <button class="primary" id="btn-start" data-ui="start">START</button>
    </div>
    <div class="label" id="title-best"></div>
  </div>

  <div class="screen" id="screen-mode" data-ui="screen-mode">
    <div class="neon big">モードを選ぶ</div>
    <div class="btns">
      <button class="primary" id="btn-mode-stage" data-ui="mode-stage">ステージ</button>
      <button class="second" id="btn-mode-endless" data-ui="mode-endless">エンドレス</button>
    </div>
    <div class="sub">ステージ: 8つのゾーンを順に攻略／エンドレス: どこまで走れるか</div>
    <div class="btns"><button class="ghost" data-ui="back-title">戻る</button></div>
  </div>

  <div class="screen" id="screen-stages" data-ui="screen-stages">
    <div class="neon big">ステージ選択</div>
    <div id="stage-grid" data-ui="stage-grid"></div>
    <div class="btns"><button class="ghost" data-ui="back-mode">戻る</button></div>
  </div>

  <div class="screen" id="screen-dead" data-ui="screen-result-dead">
    <div class="result-big result-dead">CRASH</div>
    <div class="sub"><span id="dead-dist">0 m</span><br><span id="dead-cp"></span></div>
    <div class="label" id="dead-best"></div>
    <div class="btns">
      <button class="primary" id="btn-retry" data-ui="retry">リトライ</button>
      <button id="btn-title" data-ui="title">タイトルへ</button>
    </div>
  </div>

  <div class="screen" id="screen-clear" data-ui="screen-result-clear">
    <div class="result-big result-clear">CLEAR</div>
    <div class="sub" id="clear-dist"></div>
    <div class="label" id="clear-best"></div>
    <div class="btns">
      <button class="primary" id="btn-next" data-ui="next">次へ</button>
      <button id="btn-retry2" data-ui="retry-clear">もう一度</button>
      <button id="btn-title2" data-ui="title">タイトルへ</button>
    </div>
  </div>
</div>

<!-- three.min.js(r158 UMD) は読み込み時に廃止予定の警告を1行出す。
     コンソールを汚さないよう、この1行だけを読み込み中に限って握りつぶす。 -->
<script>
  (function(){ const w=console.warn; window.__warnRestore=w;
    console.warn=function(m){ if(typeof m==='string'&&m.indexOf('are deprecated with r150+')>=0) return; return w.apply(console,arguments); }; })();
</script>
<script src="js/three.min.js"></script>
<script>console.warn = window.__warnRestore; delete window.__warnRestore;</script>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/zones.js"></script>
<script src="js/obstacles.js"></script>
<script src="js/chunks.js"></script>
<script src="js/runners.js"></script>
<script src="js/setpieces.js"></script>
<script src="js/zone_neon.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/hud.js"></script>
<script src="js/bot.js"></script>
<script src="js/core.js"></script>
<script src="js/testhook.js"></script>

<!-- 機械テスト（DUO.__suites に push するだけ。製品の挙動には影響しない） -->
<script src="tests/test_fairness.js"></script>
<script src="tests/test_input.js"></script>
<script src="tests/test_collision.js"></script>
<script src="tests/test_bot.js"></script>
<script src="tests/test_touch.js"></script>
<script src="tests/test_p2a.js"></script>
<script src="tests/test_p2a3.js"></script>
<script src="tests/test_p2b.js"></script>

<script>
  (function boot(){
    // iPhone/iPad 専用（契約§1）。タッチ領域は常時表示する
    function updateTouchUI(){ document.body.classList.add('touch'); }
    updateTouchUI();
    Game.init(document.getElementById('gl'));
    UI.init(Game);
    window.addEventListener('resize', function(){ World.resize(); updateTouchUI(); });
    Game.run();
  })();
</script>
</body>
</html>
